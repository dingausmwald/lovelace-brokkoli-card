---
name: "Auto Release"

on:
  push:
    branches:
      - 'main'
      - 'master'
    paths:
      - 'package.json'

jobs:
  build:
    name: "Build Release"
    runs-on: "ubuntu-latest"
    steps:
      - name: "✏️ Checkout code"
        uses: actions/checkout@v4
        with: 
          path: './'
      - name: "🏷️ Get version tag"
        id: set_var
        run: echo "COMPONENT_VERSION=$(node -p "require('./package.json').version")" >> $GITHUB_ENV

      - name: "🏷️ Check if tag exists already"
        uses: mukunku/tag-exists-action@v1.4.0
        id: "check_tag"
        with: 
          tag: "v${{ env.COMPONENT_VERSION }}"

      - name: "❌ Cancel if tag is already present"
        run: |
          echo "Tag already present: v${{ env.COMPONENT_VERSION }}. Not creating a new release"
          gh run cancel ${{ github.run_id }}
          gh run watch ${{ github.run_id }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        if: steps.check_tag.outputs.exists == 'true'
 
      - name: "👷 Build using Node.js"
        uses: actions/setup-node@v3
        with:
          node-version: '20.x'
      - run: npm ci
      - run: npm run build --if-present

      - name: "📝 Commit files"
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add brokkoli-card.js brokkoli-card.js.gz brokkoli-card.js.LICENSE.txt
          git add brokkoli-area-card.js brokkoli-area-card.js.gz
          git add brokkoli-list-card.js brokkoli-list-card.js.gz
          git add brokkoli-sensor-assignment-card.js brokkoli-sensor-assignment-card.js.gz
          git status
          if git diff --cached --quiet; then
            echo "Build ist identisch zum Commit — nichts zu committen."
          else
            git commit -m "Add new build"
          fi
      - name: "⬆️ Push changes"
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
  
  auto-release:
    name: "Auto Release"
    runs-on: "ubuntu-latest"
    needs: build
    steps:
      - name: "⬇️ Checkout new code"
        uses: actions/checkout@v4
        with: 
          ref: master
          path: './'

      - name: "🏷️ Get version tag"
        id: set_var
        run: echo "COMPONENT_VERSION=$(node -p "require('./package.json').version")" >> $GITHUB_ENV

      - name: "🏷️ Get git sha"
        id: set_var_2
        run: echo "CURRENT_SHA=$(git log -1 --format='%H')" >> $GITHUB_ENV

      - name: "🏷️ Check if tag exists already"
        uses: mukunku/tag-exists-action@v1.4.0
        id: "check_tag"
        with: 
          tag: "v${{ env.COMPONENT_VERSION }}"

      - name: "❌ Cancel if tag is already present"
        run: |
          echo "Tag already present: v${{ env.COMPONENT_VERSION }}. Not creating a new release"
          gh run cancel ${{ github.run_id }}
          gh run watch ${{ github.run_id }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        if: steps.check_tag.outputs.exists == 'true'

      - name: "🗝️ Get previous release version"
        id: last_release
        uses: InsonusK/get-latest-release@v1.1.0
        with:
          myToken: ${{ github.token }}
          exclude_types: "draft|prerelease"

      - name: "🏷️ Create new tag"
        uses: rickstaa/action-create-tag@v1
        id: "tag_create"
        with:
          tag: "v${{ env.COMPONENT_VERSION }}"
          commit_sha: "${{ env.CURRENT_SHA }}"
          tag_exists_error: false
          message: "Version ${{ env.COMPONENT_VERSION }}"

      - name: "🗒️ Generate release changelog"
        id: changelog
        uses: heinrichreimer/github-changelog-generator-action@v2.3
        with:
          token: ${{ secrets.GITHUB_TOKEN }} 
          sinceTag: ${{ steps.last_release.outputs.tag_name }}
          headerLabel: "# Notable changes since ${{ steps.last_release.outputs.tag_name }}"
          stripGeneratorNotice: true

      - name: 👍 Create Stable release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: false
          body: "${{ steps.changelog.outputs.changelog }}"
          name: "Version ${{ env.COMPONENT_VERSION }}"
          tag_name: "v${{ env.COMPONENT_VERSION }}"
          target_commitish: "${{ env.CURRENT_SHA }}"
          # HACS laedt bei vorhandenen Release-Assets ausschliesslich diese.
          # Damit ist exakt festgelegt, was im Frontend landet.
          files: |
            brokkoli-card.js
            brokkoli-area-card.js
            brokkoli-list-card.js
            brokkoli-sensor-assignment-card.js
        if: contains(env.COMPONENT_VERSION, 'beta') == false

      - name: 🤞 Create Beta release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          body: "${{ steps.changelog.outputs.changelog }}"
          name: "Version ${{ env.COMPONENT_VERSION }}"
          tag_name: "v${{ env.COMPONENT_VERSION }}"
          target_commitish: "${{ env.CURRENT_SHA }}"
          files: |
            brokkoli-card.js
            brokkoli-area-card.js
            brokkoli-list-card.js
            brokkoli-sensor-assignment-card.js
        if: contains(env.COMPONENT_VERSION, 'beta') == true
